<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIARIOT - LoRaWAN für IoT</title>
    <style>
        body {
            background-color: #000000;
            color: #FF8C00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 40px 0 20px;
            border-bottom: 2px solid #333333;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
        }

        .projekt-karte {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #FF8C00;
            margin-bottom: 25px;
            text-align: center;
        }

        .projekt-karte h2 {
            margin-top: 0;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            border: 1px solid #FF8C00;
            margin: 20px 0;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* Contenedor de botones de manuales */
        .manual-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 140, 0, 0.4);
        }

        .manual-title {
            font-size: 1.1em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-manual {
            display: inline-block;
            background-color: transparent;
            color: #FF8C00;
            border: 1px solid #FF8C00;
            padding: 9px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.2s ease-in-out;
        }

        .btn-manual:hover {
            background-color: #FF8C00;
            color: #000000;
        }

        footer {
            text-align: center;
            font-size: 0.9em;
            margin-top: 50px;
            color: #777777;
        }
    </style>
</head>
<body>

    <header>
        <h1>APIARIOT</h1>
        <p>LoRaWAN für IoT</p>
    </header>

    <main>
        <section class="projekt-karte">
            <h2>Aktuelles Projekt: LoRaWAN-Knoten (868MHz)</h2>
            <p>Sensoren & Hardware-Design.</p>

            <!-- Tu imagen principal intacta -->
            <img src="LogoContorno.png" alt="KiCad Schaltplan oder Leiterplatte">

            <!-- Enlaces directos para abrir el manual en nueva pestaña o leer en línea -->
            <div class="manual-container">
                <div class="manual-title">Dokumentation / Manual: Erste Schritte im IoT mit LoRaWAN</div>
                <div class="btn-group">
                    <a href="IoT_LoRaWAN_DE.pdf" target="_blank" rel="noopener noreferrer" class="btn-manual">
                        🇩🇪 Deutsch (PDF)
                    </a>
                    <a href="IoT_LoRaWAN_ES.pdf" target="_blank" rel="noopener noreferrer" class="btn-manual">
                        🇪🇸 Español (PDF)
                    </a>
                    <a href="IoT_LoRaWAN_EN.pdf" target="_blank" rel="noopener noreferrer" class="btn-manual">
                        🇬🇧 English (PDF)
                    </a>
                </div>
            </div>
        </section>

        <section class="projekt-karte">
            <h2>Bombus</h2>
            <p>(PCB) <strong>Schaltung</strong> BOM.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Erstellt mit GitHub Pages</p>
    </footer>

</body>
</html>
